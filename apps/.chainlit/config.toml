[project]
# Whether to enable telemetry (default: true). No personal data is collected.
enable_telemetry = false

# List of environment variables to be provided by each user to use the app.
user_env = []

# Duration (in seconds) during which the session is saved when the connection is lost
session_timeout = 3600

# Enable third parties caching (e.g LangChain cache)
cache = false

# Authorized origins
allow_origins = ["*"]

# Follow symlink for asset mount (see https://github.com/Chainlit/chainlit/issues/317)
# follow_symlink = false

[features]
# Spontaneous file upload feature. Disabled by default
#   Authorize spontaneous file uploads, set to "true" to enable
#     max_files: Maximum number of files that can be uploaded at once
#     max_size_mb: Maximum file size in MB
[features.spontaneous_file_upload]
    enabled = false
    accept = ["*/*"]
    max_files = 5
    max_size_mb = 10

# Process and display audio messages
[features.audio]
    # Minimum duration (ms) of silence to stop speech-to-text recording
    # Used to detect speaker pauses
    min_decibels = -45
    # Delay (ms) from the end of "speech" activity to when recording stops
    initial_silence_timeout = 3000
    # Maximum recording duration (ms)
    # Prevents indefinite recordings
    silence_timeout = 1500
    # Limits recording duration (ms)
    max_duration = 15000
    # Volume level (%) for input chunk loudness classification (0-100)
    chunk_duration = 1000
    # Duration (ms) per audio chunk for volume analysis
    sample_rate = 44100

# Authorize users to edit their own messages
[features.edit_message]
    enabled = true

# Authorize users to use latex rendering
[features.latex]
    enabled = true

# Allow users to use speech to text
[features.speech_to_text]
    enabled = false

# Show the prompt playground
[features.prompt_playground]
    enabled = false

[UI]
# Name of the app and chatbot.
name = "AATWW: Agent and the Whole Works"

# Show the readme while the thread is empty.
show_readme_as_default = false

# Description of the app and target audience.
description = "E2E Multi-Agent Supervisor with AI/BI Genie, Vector Search, SQL/Python functions, MCP tools, External API, LakeBase memory, and Databricks Apps"

# Large size content are by default collapsed for a cleaner ui
default_collapse_content = true

# The default value for the expand messages settings.
default_expand_messages = false

# Hide the chain of thought details from the user in the UI.
hide_cot = false

# Link to your github repo. This will add a github button in the UI's header.
# github = ""

# Specify a CSS file that can be used to customize the user interface.
# The CSS file can be served from the public directory or via an external link.
# custom_css = "/public/test.css"

# Specify a Javascript file that can be used to customize the user interface.
# The Javascript file can be served from the public directory.
# custom_js = "/public/test.js"

# Specify a custom font url.
# custom_font = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"

# Specify a custom meta image url.
# custom_meta_image_url = "https://example.com/meta-image.png"

# Specify a custom build directory for the frontend.
# This can be used to customize the frontend code.
# Be careful: If this is a relative path, it should be relative to the location of the
# temporary main.py file Chainlit creates when running the app.
# custom_build = "./public/build"

# Override default MUI light theme. (Check https://docs.chainlit.io/customisation/theme#theme-customization for details)
[UI.theme]
    font_family = "Inter, sans-serif"

[UI.theme.light]
    background = "#fafafa"
    paper = "#ffffff"

    [UI.theme.light.primary]
        main = "#1976d2"
        dark = "#1565c0"
        light = "#42a5f5"

[UI.theme.dark]
    background = "#1a1a1a"
    paper = "#262626"

    [UI.theme.dark.primary]
        main = "#90caf9"
        dark = "#42a5f5"
        light = "#e3f2fd"

[meta]
generated_by = "1.1.0"
